# Yearly college refresh (Cloud Workflow "fantasy-college-yearly"): pull the season that just
# finished from College Football Data, then rebuild the silver college fact and the crosswalk.
# Triggered once a year by Cloud Scheduler about two weeks after the CFP title game (see
# .github/workflows/deploy-orchestration.yaml, SCHEDULE_COLLEGE). Sequential: the silver job reads
# the bronze the backfill writes. Either failure fails the run.
#
# The backfill job runs with CFBD_SEASONS=last (the most recently completed season, re-fetched
# even when a partial partition exists) and reads CFBD_API_KEY from Secret Manager (cfbd-api-key);
# both are set on the job by deploy-data-engineering.yaml.
main:
  params: [input]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: "us-central1"
    - backfill:
        call: run_job
        args:
          project: ${project}
          location: ${location}
          job: "cfbd-backfill"
    - silver:
        call: run_job
        args:
          project: ${project}
          location: ${location}
          job: "silver-fact-college-player-season"
    - done:
        return: "College refresh completed: backfill + silver succeeded."

run_job:
  params: [project, location, job]
  steps:
    - execute:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + location + "/jobs/" + job}
        result: execution
    - return_result:
        return: ${execution}
