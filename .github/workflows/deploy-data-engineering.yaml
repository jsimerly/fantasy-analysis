name: Deploy Data Engineering Jobs

# One consolidated image for all of data_engineering/ (built from data_engineering/Dockerfile);
# every Cloud Run job runs one module via `python -m <package.module>`.
on:
  push:
    branches:
      - main
    paths:
      - "data_engineering/src/**"
      - "data_engineering/pyproject.toml"
      - "data_engineering/uv.lock"
      - "data_engineering/Dockerfile"
  workflow_dispatch:

env:
  IMAGE: us-central1-docker.pkg.dev/fantasy-football-473418/cloud-run-jobs/data-engineering

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "projects/624985976737/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-actions-deployer@fantasy-football-473418.iam.gserviceaccount.com"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"

      - name: "Configure Docker"
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: "Build and Push Docker Image"
        run: |
          docker build -t ${IMAGE}:${{ github.sha }} -t ${IMAGE}:latest \
            -f data_engineering/Dockerfile data_engineering
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest

      - name: "Deploy Cloud Run Jobs"
        run: |
          # job-name -> "module:memory:cpu:task-timeout"  (defaults preserved from the
          # former per-package workflows: sleeper/ktc 512Mi; nflverse/fantasycalc/silver
          # 1Gi; heavier silver facts 2Gi; staging 8Gi/2cpu -- it collects ~10M long rows
          # in memory and was OOM-killed at 4Gi in 2026-09; fantasycalc 45m timeout).
          declare -A jobs=(
            # --- sleeper (512Mi) ---
            ["sleeper-incremental-league"]="sleeper_ingestion.daily.incremental_league:512Mi:1:30m"
            ["sleeper-incremental-rosters"]="sleeper_ingestion.daily.incremental_rosters:512Mi:1:30m"
            ["sleeper-incremental-transactions"]="sleeper_ingestion.daily.incremental_transactions:512Mi:1:30m"
            ["sleeper-incremental-players"]="sleeper_ingestion.daily.incremental_players:512Mi:1:30m"
            ["sleeper-incremental-users"]="sleeper_ingestion.daily.incremental_users:512Mi:1:30m"
            ["sleeper-commissioner-adjustments"]="sleeper_ingestion.historical.commissioner_adjustments:512Mi:1:30m"
            ["sleeper-league-lineage"]="sleeper_ingestion.historical.league_lineage_ingestion:512Mi:1:30m"
            ["sleeper-league-transactions"]="sleeper_ingestion.historical.league_transactions_ingestion:512Mi:1:30m"
            ["sleeper-drafts-overview"]="sleeper_ingestion.historical.league_drafts_ingestion:512Mi:1:30m"
            ["sleeper-draft-picks"]="sleeper_ingestion.historical.league_draft_picks_ingestion:512Mi:1:30m"
            # --- ktc (512Mi) ---
            ["ktc-full-dynasty"]="ktc_ingestion.dynasty.full_dynasty:512Mi:1:30m"
            ["ktc-incremental-dynasty"]="ktc_ingestion.dynasty.incremental_dynasty:512Mi:1:30m"
            ["ktc-full-devy"]="ktc_ingestion.devy.full_devy:512Mi:1:30m"
            ["ktc-incremental-devy"]="ktc_ingestion.devy.incremental_devy:512Mi:1:30m"
            ["ktc-full-redraft"]="ktc_ingestion.redraft.full_redraft:512Mi:1:30m"
            ["ktc-incremental-redraft"]="ktc_ingestion.redraft.incremental_redraft:512Mi:1:30m"
            # manual: rebuild missing daily_load partitions from per-player history pages
            # (~1000 pages at the polite 2-6s spacing -> hours, not minutes)
            ["ktc-backfill-daily"]="ktc_ingestion.backfill_daily_from_history:512Mi:1:3h"
            # --- fantasycalc (1Gi, 45m) ---
            ["fantasycalc-daily"]="fantasycalc_ingestion.daily_ingestion:1Gi:1:45m"
            # --- nflverse (1Gi) ---
            ["nflverse-combine"]="nflverse_ingestion.combine_ingestion:1Gi:1:30m"
            ["nflverse-daily"]="nflverse_ingestion.daily_ingestion:1Gi:1:30m"
            ["nflverse-draft"]="nflverse_ingestion.draft_ingestion:1Gi:1:30m"
            ["nflverse-full"]="nflverse_ingestion.full_ingestion:1Gi:1:30m"
            ["nflverse-nfl-draft-picks"]="nflverse_ingestion.nfl_draft_picks:1Gi:1:30m"
            ["nflverse-schedule"]="nflverse_ingestion.schedule_ingestion:1Gi:1:30m"
            # in the daily DAG: reconcile mode loads any missing past season of every seasonal
            # dataset (no-op when complete). Explicit mode via execution env overrides, e.g.
            #   gcloud run jobs execute nflverse-backfill-seasonal --region us-central1 \
            #     --update-env-vars DATASET=snap_counts,START_SEASON=2012,OVERWRITE=true
            ["nflverse-backfill-seasonal"]="nflverse_ingestion.backfill_seasonal:2Gi:1:2h"
            # --- silver (1Gi; heavier facts 2Gi; staging 4Gi/2cpu) ---
            ["silver-dim-franchise-meta"]="silver_fantasy.dim_franchise_meta:1Gi:1:30m"
            ["silver-dim-league-meta"]="silver_fantasy.dim_leagues_meta:1Gi:1:30m"
            ["silver-dim-league-settings"]="silver_fantasy.dim_league_settings_scd2:1Gi:1:30m"
            ["silver-dim-player-master"]="silver_fantasy.dim_player_master:1Gi:1:30m"
            ["silver-dim-users"]="silver_fantasy.dim_users:1Gi:1:30m"
            ["silver-dim-dates"]="silver_fantasy.dim_dates:1Gi:1:30m"
            ["silver-dim-league-events"]="silver_fantasy.dim_league_events:1Gi:1:30m"
            ["silver-staging-asset-alignment"]="silver_fantasy._staging.asset_alignment:8Gi:2:30m"
            ["silver-fact-asset-values"]="silver_fantasy.fact_asset_values:2Gi:1:30m"
            ["silver-fact-roster-membership"]="silver_fantasy.fact_roster_membership:2Gi:1:30m"
            ["silver-fact-pick-values"]="silver_fantasy.fact_pick_values:2Gi:1:30m"
            ["silver-fact-player-week"]="silver_fantasy.fact_player_week:2Gi:1:30m"
            ["silver-fact-player-season"]="silver_fantasy.fact_player_season:1Gi:1:30m"
            ["silver-fact-player-injury-week"]="silver_fantasy.fact_player_injury_week:1Gi:1:30m"
            ["silver-fact-depth-chart-week"]="silver_fantasy.fact_depth_chart_week:2Gi:1:30m"
            # weekly status of every skill player (played / bye / injured by class / suspended / practice squad / inactive / released); T3 in the DAG
            ["silver-fact-player-week-status"]="silver_fantasy.fact_player_week_status:2Gi:1:30m"
            # college (CFBD): once a year via the fantasy-college-yearly workflow (orchestration/college.yaml):
            # cfbd-backfill (CFBD_SEASONS=last, key from Secret Manager "cfbd-api-key", set below) then
            # silver-fact-college-player-season (reads bronze/cfbd + silver fact_player_season for the crosswalk)
            ["cfbd-backfill"]="cfbd_ingestion.backfill:1Gi:1:45m"
            ["silver-fact-college-player-season"]="silver_fantasy.fact_college_player_season:2Gi:1:30m"
            # standalone daily job (not in the DAG): in-season FantasyPros projection capture;
            # self-gates to the NFL season, triggered by its own scheduler (below).
            ["fantasypros-live-current"]="fantasypros_ingestion.live_current:512Mi:1:30m"
          )

          for job_name in "${!jobs[@]}"; do
            IFS=':' read -r module mem cpu timeout <<< "${jobs[$job_name]}"
            echo "Deploying ${job_name} -> python -m ${module} (mem=${mem}, cpu=${cpu}, timeout=${timeout})"
            gcloud run jobs deploy "${job_name}" \
              --image=${IMAGE}:latest \
              --region=us-central1 \
              --memory="${mem}" \
              --cpu="${cpu}" \
              --max-retries=1 \
              --task-timeout="${timeout}" \
              --command=python \
              --args=-m,"${module}" \
              --set-env-vars=GCS_BUCKET_NAME=nfl-data-bronze \
              --project=fantasy-football-473418
          done

          # cfbd-backfill: yearly mode + the API key from Secret Manager. Create the secret once:
          #   echo -n "<key>" | gcloud secrets create cfbd-api-key --data-file=- --project fantasy-football-473418
          #   gcloud secrets add-iam-policy-binding cfbd-api-key --member=serviceAccount:624985976737-compute@developer.gserviceaccount.com --role=roles/secretmanager.secretAccessor --project fantasy-football-473418
          # Until it exists this step only warns, so the rest of the deploy is unaffected.
          gcloud run jobs update cfbd-backfill             --region=us-central1             --update-env-vars=CFBD_SEASONS=last             --set-secrets=CFBD_API_KEY=cfbd-api-key:latest             --project=fantasy-football-473418             || echo "WARNING: cfbd-backfill not configured (is the Secret Manager secret cfbd-api-key created?)"

      # Standalone daily scheduler for the in-season FantasyPros capture (the job self-gates
      # to the NFL season, so a plain daily trigger is fine). Idempotent create-or-update.
      - name: "Ensure fantasypros-live-current daily scheduler"
        env:
          PROJECT_ID: fantasy-football-473418
          REGION: us-central1
          RUNTIME_SA: 624985976737-compute@developer.gserviceaccount.com
          NAME: fantasypros-live-current-daily
        run: |
          URI="https://${REGION}-run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/jobs/fantasypros-live-current:run"
          ACTION=create
          gcloud scheduler jobs describe "${NAME}" --location="${REGION}" --project="${PROJECT_ID}" >/dev/null 2>&1 && ACTION=update
          gcloud scheduler jobs ${ACTION} http "${NAME}" \
            --location="${REGION}" \
            --schedule="0 13 * * *" \
            --time-zone="Etc/UTC" \
            --uri="${URI}" \
            --http-method=POST \
            --oauth-service-account-email="${RUNTIME_SA}" \
            --message-body='{}' \
            --project="${PROJECT_ID}"
